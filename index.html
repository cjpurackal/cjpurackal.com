<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="styles.css" />
    <title>Christie J</title>

  <body style="height: 100vh; background-color: #212427; color: white">
    <main
      class="container h-100 d-flex flex-column align-items-center justify-content-center"
    >
      <div class="circular-avatar">
        <img
          class="h-100 w-100"
          style="object-fit: cover"
          src="./assets/images/me.jpg"
          alt="logo"
        />
      </div>

      <p class="bio">
        Computer vision engineer/consultant.For work related queries, please email to cjpurackal@gmail.com.
      </p>

      <a
        class="btn btn-primary"
        href="./assets/files/resume.pdf"
        download="christie_resume.pdf"
      >
        <span> Resume </span>
        <img src="./assets/images/icons/download.svg" alt="" />
      </a>

      <div class="d-flex mt-3">
        <a class="nav-link m-3" href="https://github.com/cjpurackal/">
          <img
            style="background-color;: white"
            src="./assets/images/icons/github.svg"
            alt=""
          />
        </a>
        <a
          class="nav-link m-3"
          style="color: white"
          href="https://www.linkedin.com/in/cjpurackal/"
        >
          <img src="./assets/images/icons/linkedin.svg" alt="" />
        </a>
        <a
          class="nav-link m-3"
          style="color: white"
          href="https://twitter.com/cjpurackal"
        >
          <img src="./assets/images/icons/twitter.svg" alt="" />
        </a>
      </div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
